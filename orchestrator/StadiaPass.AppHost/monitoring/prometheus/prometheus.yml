# StadiaPass metrics collection.
#
# The applications run on the host while Prometheus runs in a container, so the scrape targets go through
# host.docker.internal. The endpoint itself is published by StadiaPass.ServiceDefaults, which adds the
# OpenTelemetry Prometheus exporter to the very same meters the Aspire dashboard receives over OTLP.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s
  external_labels:
    environment: development
    system: stadiapass

scrape_configs:
  - job_name: stadiapass-webapi
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5042']
        labels:
          service: webapi

  - job_name: stadiapass-webmvc
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:5230']
        labels:
          service: webmvc

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: prometheus
